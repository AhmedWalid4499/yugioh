<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Duel Vault</title>
  <meta name="description" content="Personal Yu-Gi-Oh! card database, deck builder and new-release tracker.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/home">
      <span class="brand-mark" aria-hidden="true">◆</span>
      <span>Duel Vault</span>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="#/home" data-nav="home"><span aria-hidden="true">◈</span> Menu</a>
      <a href="#/duel" data-nav="duel"><span aria-hidden="true">⚔</span> Duel</a>
      <a href="#/decks" data-nav="decks"><span aria-hidden="true">🂠</span> Decks</a>
      <a href="#/build" data-nav="build"><span aria-hidden="true">⚡</span> Auto-Build</a>
      <a href="#/search" data-nav="search"><span aria-hidden="true">🔍</span> Cards</a>
      <a href="#/releases" data-nav="releases"><span aria-hidden="true">✦</span> Releases</a>
      <a href="#/help" data-nav="help" title="How everything works"><span aria-hidden="true">?</span> Help</a>
    </nav>
    <div id="app-update" class="app-update" hidden></div>
  </header>

  <main id="view" tabindex="-1"></main>

  <div id="modal" class="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-panel" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal-close" type="button" data-close aria-label="Close">×</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <footer class="footer">
    Card data and images from the free <a href="https://ygoprodeck.com/api-guide/" target="_blank" rel="noopener">YGOPRODeck API</a>.
    Decks and watchlists are saved on this device only. Not affiliated with Konami. · Duel Vault <span id="app-version"></span>
  </footer>

  <script src="js/util.js"></script>
  <script src="js/version.js"></script>
  <script src="js/formats.js"></script>
  <script src="js/api.js"></script>
  <script src="js/insights.js"></script>
  <script src="js/decks.js"></script>
  <script src="js/excel.js"></script>
  <script src="js/deckgen.js"></script>
  <script src="js/characters.js"></script>
  <script src="js/components.js"></script>
  <script src="js/view-search.js"></script>
  <script src="js/view-releases.js"></script>
  <script src="js/view-decks.js"></script>
  <script src="js/view-tools.js"></script>
  <script src="js/game.js"></script>
  <script src="js/view-home.js"></script>
  <script src="js/view-help.js"></script>
  <script src="vendor/zzfx/ZzFXMicro.min.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/duel/engine.js"></script>
  <script src="js/duel/materials.js"></script>
  <script src="js/duel/effects.js"></script>
  <script src="js/duel/bot.js"></script>
  <script src="js/duel/claude.js"></script>
  <script src="js/view-duel.js"></script>
  <script src="js/desktop.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
