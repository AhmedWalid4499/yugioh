<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Duel Vault</title>
  <meta name="description" content="Personal Yu-Gi-Oh! card database, deck builder and new-release tracker.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="theme-academy">
  <div class="academy-bg" aria-hidden="true">
    <svg class="ab-scene" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMax slice">
      <defs>
        <linearGradient id="ab-sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3fa9e6"/><stop offset="1" stop-color="#1663b5"/></linearGradient>
        <linearGradient id="ab-isle" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4fb06a"/><stop offset="1" stop-color="#2d7a47"/></linearGradient>
      </defs>
      <rect x="0" y="430" width="1600" height="170" fill="url(#ab-sea)"/>
      <path d="M380 440 C 520 330, 760 300, 900 330 C 1040 300, 1200 340, 1290 440 Z" fill="url(#ab-isle)"/>
      <g class="ab-school" fill="#f5f1e6" stroke="#c9bfa5" stroke-width="2">
        <rect x="700" y="300" width="300" height="70" rx="4"/>
        <rect x="815" y="230" width="70" height="90" rx="4"/>
        <path d="M805 232 Q 850 175 895 232 Z" fill="#e8b83a" stroke="#c48f12"/>
        <rect x="640" y="325" width="70" height="45" rx="3"/><rect x="990" y="325" width="70" height="45" rx="3"/>
      </g>
      <g fill="#7fb6e0" opacity=".9">
        <rect x="720" y="320" width="18" height="22" rx="2"/><rect x="750" y="320" width="18" height="22" rx="2"/><rect x="780" y="320" width="18" height="22" rx="2"/>
        <rect x="902" y="320" width="18" height="22" rx="2"/><rect x="932" y="320" width="18" height="22" rx="2"/><rect x="962" y="320" width="18" height="22" rx="2"/>
        <circle cx="850" cy="265" r="14" fill="#fff6d8" stroke="#c48f12" stroke-width="2"/>
      </g>
      <g class="ab-waves" stroke="#ffffff" stroke-opacity=".55" stroke-width="3" fill="none" stroke-linecap="round">
        <path d="M80 480 q 30 -12 60 0 t 60 0"/><path d="M1300 500 q 30 -12 60 0 t 60 0"/><path d="M500 530 q 30 -12 60 0 t 60 0"/><path d="M1050 560 q 30 -12 60 0 t 60 0"/>
      </g>
    </svg>
    <div class="ab-cloud c1"></div><div class="ab-cloud c2"></div><div class="ab-cloud c3"></div>
  </div>
  <header class="topbar">
    <a class="brand" href="#/home">
      <span class="brand-mark" aria-hidden="true">◆</span>
      <span>Duel Vault</span>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="#/home" data-nav="home"><span aria-hidden="true">◈</span> Menu</a>
      <a href="#/campus" data-nav="campus"><span aria-hidden="true">🏝</span> Campus</a>
      <a href="#/duel" data-nav="duel"><span aria-hidden="true">⚔</span> Duel</a>
      <a href="#/decks" data-nav="decks"><span aria-hidden="true">🂠</span> Decks</a>
      <a href="#/build" data-nav="build"><span aria-hidden="true">⚡</span> Auto-Build</a>
      <a href="#/search" data-nav="search"><span aria-hidden="true">🔍</span> Cards</a>
      <a href="#/releases" data-nav="releases"><span aria-hidden="true">✦</span> Releases</a>
      <a href="#/shop" data-nav="shop"><span aria-hidden="true">🛒</span> Shop</a>
      <a href="#/help" data-nav="help" title="How everything works"><span aria-hidden="true">?</span> Help</a>
    </nav>
    <a href="#/shop" class="dp-badge" id="dp-badge" title="Your Duel Points: win duels to earn more">1,000 DP</a>
    <div id="app-update" class="app-update" hidden></div>
  </header>

  <main id="view" tabindex="-1"></main>

  <div id="modal" class="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-panel" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal-close" type="button" data-close aria-label="Close">×</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <footer class="footer">
    Card data and images from the free <a href="https://ygoprodeck.com/api-guide/" target="_blank" rel="noopener">YGOPRODeck API</a>.
    Decks and watchlists are saved on this device only. Not affiliated with Konami. · Duel Vault <span id="app-version"></span>
  </footer>
