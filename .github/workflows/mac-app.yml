name: Mac app

# Pull requests: test and build the Mac app (download it from the run's artifacts).
# Merges to main: same, and if package.json has a version that hasn't been
# released yet, publish a GitHub Release. The app's "Check for updates"
# button picks that release up.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mac-app-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Test, build and release
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install test browser
        run: npx playwright install chromium

      - name: Test web app and updater
        run: npm test

      - name: Build web bundle
        run: npm run build:web

      - name: Test desktop app and one-click update
        run: npm run test:desktop

      - name: Build Mac app (.dmg for Apple Silicon and Intel)
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Decide whether to publish a release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ "$GITHUB_REF" = "refs/heads/main" ] && ! gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Will publish v$VERSION"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Not publishing (pull request, or v$VERSION already released)"
          fi

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: duel-vault-mac-${{ steps.plan.outputs.version }}
          path: |
            dist/app/*.dmg
            dist/duel-vault-web.zip
            dist/update.json
          retention-days: 14

      - name: Publish GitHub Release
        if: steps.plan.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.plan.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Duel Vault v${{ steps.plan.outputs.version }}
          body_path: dist/release-notes.md
          make_latest: "true"
          files: |
            dist/app/*.dmg
            dist/duel-vault-web.zip
            dist/update.json
